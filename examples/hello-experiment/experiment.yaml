# Minimal systems-lab experiment (declarative)
apiVersion: systems-lab.io/v1alpha1
kind: Experiment
metadata:
  name: hello-echo
spec:
  runtime: wasmtime   # falls back to local if wasmtime missing / non-.wasm command
  command: ["echo", "systems-lab hello"]
  capture:
    stdout: true
    exitCode: true
  ledger:
    store: libsql

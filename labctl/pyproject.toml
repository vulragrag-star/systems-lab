[project]
name = "labctl"
version = "0.1.0"
description = "CLI for systems-lab — local-first systems engineering experiments"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
labctl = "labctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["labctl*"]
